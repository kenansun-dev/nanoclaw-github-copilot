version: v2
managed:
  enabled: false
inputs:
  - directory: ../proto
plugins:
  # ts-proto → typed interfaces + grpc-js server/client stubs. Output lands in
  # relay/src/gen and is git-ignored (regenerated by `npm run gen`). Both the
  # relay (server) and, in the next task, the NCL client compile the same proto.
  - local:
      - ./node_modules/.bin/protoc-gen-ts_proto
    out: src/gen
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - importSuffix=.js
      - useExactTypes=false
      - snakeToCamel=true
